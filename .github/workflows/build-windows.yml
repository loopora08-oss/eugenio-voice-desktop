name: Build Eugenio for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish complete desktop package and run logic tests
        shell: pwsh
        run: ./build.ps1 -Destination (Join-Path $PWD 'publish/App')
      - name: Check required executable files
        shell: pwsh
        run: |
          foreach ($file in @('publish/App/VoceLocale.exe', 'publish/App/engines/WhisperWorker/WhisperWorker.exe', 'publish/App/engines/RewriteWorker/RewriteWorker.exe', 'publish/App/LEGGIMI.md')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing package file: $file" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Eugenio-App-win-x64
          path: publish/App/
          if-no-files-found: error
          retention-days: 30
